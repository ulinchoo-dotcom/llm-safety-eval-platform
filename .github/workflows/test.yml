name: backend-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safety
          POSTGRES_PASSWORD: safety_test
          POSTGRES_DB: safety_eval_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U safety -d safety_eval_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://safety:safety_test@127.0.0.1:5432/safety_eval_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
