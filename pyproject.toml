[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-safety-eval-platform"
version = "0.1.0"
description = "Versioned safety evaluation cases, review workflow and auditable offline evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "asyncpg>=0.29,<1", "pydantic-settings>=2.6,<3", "langgraph>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["safety_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
